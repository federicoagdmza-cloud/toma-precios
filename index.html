<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toma de Precios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #1e293b; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
        .bg-card { background-color: #334155; }
        .bg-darker { background-color: #0f172a; }
        .text-accent { color: #fbbf24; }
        .bg-accent { background-color: #f59e0b; }
        .border-accent { border-color: #f59e0b; }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="text"] { -moz-appearance: textfield; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="antialiased pb-24">

    <!-- PANTALLA 1: SELECCIÓN DE LOCAL -->
    <div id="home-view" class="p-4 max-w-2xl mx-auto">
        <p class="text-xs font-semibold text-gray-400 tracking-wider mb-1 uppercase">Toma de Precios</p>
        <h1 class="text-3xl font-bold mb-6">¿En qué local estás?</h1>
        <div id="profiles-container" class="flex flex-col gap-3">
            <!-- Se cargan por JavaScript -->
        </div>
    </div>

    <!-- PANTALLA 2: FORMULARIO DE CARGA -->
    <div id="form-view" class="hidden max-w-2xl mx-auto">
        <div class="sticky top-0 bg-darker p-4 flex justify-between items-center z-10 shadow-md">
            <button onclick="goHome()" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded text-sm font-medium transition-colors">
                &larr; Volver
            </button>
            <div class="flex items-center gap-2">
                <div class="w-2.5 h-2.5 rounded-full bg-emerald-500"></div>
                <span id="current-local-name" class="font-bold text-emerald-500 tracking-wide"></span>
            </div>
        </div>

        <div id="products-container" class="p-4 flex flex-col gap-4"></div>

        <div class="fixed bottom-0 left-0 w-full bg-darker p-4 border-t border-gray-800 z-10 flex justify-center shadow-lg">
            <button onclick="exportarToma()" class="w-full max-w-2xl bg-accent hover:bg-amber-600 text-slate-900 font-bold py-4 rounded-lg text-lg transition-colors shadow-lg">
                Revisar y Enviar Toma
            </button>
        </div>
    </div>

<script>
    // LISTA DE LOCALES LIMPIA
    const locales = [
        { local: "AIELLO", tipo: "Supermercado" },
        { local: "VEA", tipo: "Supermercado" },
        { local: "ATOMO", tipo: "Supermercado" },
        { local: "BLOW MAX", tipo: "Mayorista" },
        { local: "CAFE AMERICA", tipo: "Mayorista" },
        { local: "LA ANONIMA", tipo: "Supermercado" },
        { local: "CHANGO MAS", tipo: "Supermercado" },
        { local: "JUMBO", tipo: "Supermercado" },
        { local: "COTO", tipo: "Supermercado" },
        { local: "EUROPA", tipo: "Supermercado" },
        { local: "EUROPA MAYORISTA", tipo: "Mayorista" },
        { local: "CARREFOUR", tipo: "Supermercado" },
        { local: "OSCAR DAVID", tipo: "Mayorista" },
        { local: "MAKRO", tipo: "Mayorista" }
    ];

    const productosBase = [
        // --- SUPERMERCADOS ---
        { cat: "MAYONESA", marca: "Cada Dia", gr: "DP 500cc", canal: "Supermercado" },
        { cat: "MAYONESA", marca: "Canuelas", gr: "DP 500cc", canal: "Supermercado" },
        { cat: "MAYONESA", marca: "Danica", gr: "DP 500cc", canal: "Supermercado" },
        { cat: "MAYONESA", marca: "Danica Fiesta", gr: "DP 500cc", canal: "Supermercado" },
        { cat: "MAYONESA", marca: "Hellmann's", gr: "DP 500cc", canal: "Supermercado" },
        { cat: "MAYONESA", marca: "Natura", gr: "DP 500cc", canal: "Supermercado" },
        { cat: "MAYONESA", marca: "Cada Dia", gr: "DP 1000cc", canal: "Supermercado" },
        { cat: "MAYONESA", marca: "Canuelas", gr: "DP 1000cc", canal: "Supermercado" },
        { cat: "MAYONESA", marca: "Danica", gr: "DP 1000cc", canal: "Supermercado" },
        { cat: "MAYONESA", marca: "Danica Fiesta", gr: "DP 1000cc", canal: "Supermercado" },
        { cat: "MAYONESA", marca: "Hellmann's", gr: "DP 1000cc", canal: "Supermercado" },
        { cat: "MAYONESA", marca: "Natura", gr: "DP 1000cc", canal: "Supermercado" },

        // --- MAYORISTAS ---
        { cat: "MAYONESA", marca: "Cada Dia", gr: "DP 250cc", canal: "Mayorista" },
        { cat: "MAYONESA", marca: "Canuelas", gr: "DP 250cc", canal: "Mayorista" },
        { cat: "MAYONESA", marca: "Danica", gr: "DP 250cc", canal: "Mayorista" },
        { cat: "MAYONESA", marca: "Danica Fiesta", gr: "DP 250cc", canal: "Mayorista" },
        { cat: "MAYONESA", marca: "Hellmann's", gr: "DP 250cc", canal: "Mayorista" },
        { cat: "MAYONESA", marca: "Natura", gr: "DP 250cc", canal: "Mayorista" },
        { cat: "MAYONESA", marca: "Cada Dia", gr: "DP 500cc", canal: "Mayorista" },
        { cat: "MAYONESA", marca: "Canuelas", gr: "DP 500cc", canal: "Mayorista" },
        { cat: "MAYONESA", marca: "Danica", gr: "DP 500cc", canal: "Mayorista" },
        { cat: "MAYONESA", marca: "Danica Fiesta", gr: "DP 500cc", canal: "Mayorista" },
        { cat: "MAYONESA", marca: "Hellmann's", gr: "DP 500cc", canal: "Mayorista" },
        { cat: "MAYONESA", marca: "Natura", gr: "DP 500cc", canal: "Mayorista" },

        // --- AMBOS CANALES ---
        { cat: "KETCHUP", marca: "Danica", gr: "DP 250cc", canal: "Ambos" },
        { cat: "KETCHUP", marca: "Hellmann's", gr: "DP 250cc", canal: "Ambos" },
        { cat: "KETCHUP", marca: "Natura", gr: "DP 250cc", canal: "Ambos" },
        { cat: "KETCHUP", marca: "Hellmann's", gr: "DP 500cc", canal: "Ambos" },
        { cat: "KETCHUP", marca: "Natura", gr: "DP 500cc", canal: "Ambos" },
        { cat: "BARBACOA", marca: "Hellmann's", gr: "DP 250cc", canal: "Ambos" },
        { cat: "BARBACOA", marca: "La Campagnola", gr: "DP 250cc", canal: "Ambos" },
        { cat: "BARBACOA", marca: "Danica", gr: "DP 250cc", canal: "Ambos" },
        { cat: "BARBACOA", marca: "Danica Fiesta", gr: "DP 250cc", canal: "Ambos" },
        { cat: "BARBACOA", marca: "Natura", gr: "DP 250cc", canal: "Ambos" },
        { cat: "BARBACOA", marca: "Hellmann's", gr: "DP 500cc", canal: "Ambos" },
        { cat: "BARBACOA", marca: "Natura", gr: "DP 500cc", canal: "Ambos" },
        { cat: "GOLF", marca: "Danica", gr: "DP 250cc", canal: "Ambos" },
        { cat: "GOLF", marca: "Hellmann's", gr: "DP 250cc", canal: "Ambos" },
        { cat: "GOLF", marca: "Natura", gr: "DP 250cc", canal: "Ambos" },
        { cat: "MOSTAZA", marca: "Danica", gr: "DP 250cc", canal: "Ambos" },
        { cat: "MOSTAZA", marca: "Savora", gr: "DP 250cc", canal: "Ambos" },
        { cat: "MOSTAZA", marca: "Natura", gr: "DP 250cc", canal: "Ambos" },
        { cat: "MOSTAZA", marca: "Savora", gr: "DP 500cc", canal: "Ambos" },
        { cat: "MOSTAZA", marca: "Natura", gr: "DP 500cc", canal: "Ambos" },
        { cat: "EXTRA VIRGEN", marca: "OLIOVITA", gr: "pet 500cc", canal: "Ambos" },
        { cat: "EXTRA VIRGEN", marca: "NUCETE", gr: "pet 500cc", canal: "Ambos" },
        { cat: "EXTRA VIRGEN", marca: "Cocinero", gr: "pet 500cc", canal: "Ambos" },
        { cat: "EXTRA VIRGEN", marca: "Lira", gr: "pet 500cc", canal: "Ambos" },
        { cat: "EXTRA VIRGEN", marca: "Canuelas", gr: "pet 500cc", canal: "Ambos" },
        { cat: "EXTRA VIRGEN", marca: "Natura", gr: "pet 500cc", canal: "Ambos" },
        
        { cat: "OLIVADOS", marca: "Lira", gr: "pet 900cc", canal: "Ambos", alias: "OLIVADOS Girasol+Oliva Lira (pet 900cc)" },
        { cat: "OLIVADOS", marca: "Cocinero", gr: "pet 900cc", canal: "Ambos", alias: "OLIVADOS Girasol+Oliva Cocinero (pet 900cc)" },
        { cat: "OLIVADOS", marca: "Copisi", gr: "pet 900cc", canal: "Ambos", alias: "OLIVADOS Girasol+Oliva Copisi (pet 900cc)" },
        { cat: "OLIVADOS", marca: "Natura", gr: "pet 900cc", canal: "Ambos", alias: "OLIVADOS Girasol+Oliva Natura Blend (pet 900cc)" },
        
        { cat: "MAIZ", marca: "Lira", gr: "pet 900cc", canal: "Ambos" },
        { cat: "MAIZ", marca: "Arcor", gr: "pet 900cc", canal: "Ambos" },
        { cat: "MAIZ", marca: "Mazola", gr: "pet 900cc", canal: "Ambos" },
        { cat: "AERO", marca: "Mca propia", gr: "120cc", canal: "Ambos" },
        { cat: "AERO", marca: "Fritolim", gr: "120cc", canal: "Ambos" },
        { cat: "AERO", marca: "Natura", gr: "120cc", canal: "Ambos" },
        { cat: "ACEI. TRADICIO", marca: "Pureza", gr: "900cc", canal: "Ambos" },
        { cat: "ACEI. TRADICIO", marca: "Legitimo", gr: "900cc", canal: "Ambos" },
        { cat: "ACEI. TRADICIO", marca: "Cocinero girasol", gr: "900cc", canal: "Ambos" },
        { cat: "ACEI. TRADICIO", marca: "Canuelas", gr: "900cc", canal: "Ambos" },
        { cat: "ACEI. TRADICIO", marca: "Natura", gr: "900cc", canal: "Ambos" },
        { cat: "ACEI. TRADICIO", marca: "Pureza", gr: "1500cc", canal: "Ambos" },
        { cat: "ACEI. TRADICIO", marca: "Legitimo", gr: "1500cc", canal: "Ambos" },
        { cat: "ACEI. TRADICIO", marca: "Cocinero girasol", gr: "1500cc", canal: "Ambos" },
        { cat: "ACEI. TRADICIO", marca: "Canuelas", gr: "1500cc", canal: "Ambos" },
        { cat: "ACEI. TRADICIO", marca: "Natura", gr: "1500cc", canal: "Ambos" }
    ];

    let currentSession = null;

    window.onload = function() {
        const container = document.getElementById('profiles-container');
        container.innerHTML = "";
        
        locales.forEach((p, index) => {
            const initials = p.local.substring(0, 2).toUpperCase();
            
            const card = document.createElement('div');
            card.className = "bg-card p-4 rounded-xl flex items-center gap-4 cursor-pointer hover:bg-slate-700 transition active:scale-95";
            card.onclick = function() { openForm(index); };
            card.innerHTML = `
                <div class="w-12 h-12 rounded-lg bg-slate-600 flex items-center justify-center text-accent font-bold text-lg">${initials}</div>
                <div>
                    <h2 class="font-bold text-xl leading-tight">${p.local}</h2>
                    <p class="text-sm text-gray-400">${p.tipo}</p>
                </div>
            `;
            container.appendChild(card);
        });
    };

    function openForm(profileIndex) {
        currentSession = locales[profileIndex];
        document.getElementById('home-view').classList.add('hidden');
        document.getElementById('form-view').classList.remove('hidden');
        document.getElementById('current-local-name').innerText = currentSession.local.toUpperCase();
        window.scrollTo(0, 0);
        renderProducts();
    }

    function goHome() {
        if(confirm("¿Seguro que quieres volver? Se perderán los datos no enviados.")){
            document.getElementById('form-view').classList.add('hidden');
            document.getElementById('home-view').classList.remove('hidden');
            currentSession = null;
        }
    }

    function renderProducts() {
        const container = document.getElementById('products-container');
        container.innerHTML = ''; 

        const prodsFiltrados = productosBase.filter(p => p.canal === "Ambos" || p.canal === currentSession.tipo);

        // --- MAGIA 1: RECUPERAR DATOS DEL CELULAR ---
        let memoriaGuardada = {};
        try {
            memoriaGuardada = JSON.parse(localStorage.getItem('memoriaPreciosApp')) || {};
        } catch(e) {}
        const preciosDeEsteLocal = memoriaGuardada[currentSession.local] || {};
        // --------------------------------------------

        prodsFiltrados.forEach((prod, idx) => {
            const prodId = `prod_${idx}`;
            const tituloVisible = prod.alias ? prod.alias : `${prod.cat} ${prod.marca} ${prod.gr}`;

            // CREAR CLAVE PARA BUSCAR SI HAY PRECIO GUARDADO
            const claveProducto = prod.cat + '_' + prod.marca + '_' + prod.gr;
            const datosViejos = preciosDeEsteLocal[claveProducto];
            
            let valPrecio = "";
            let esOferta = false;
            let esFS = false;
            
            if (datosViejos) {
                valPrecio = (datosViejos.precio !== "0" && datosViejos.precio !== 0) ? datosViejos.precio : "";
                esOferta = datosViejos.oferta === "SI";
                esFS = datosViejos.fs === "SI";
            }
            
            // ASIGNAR ESTILOS SEGÚN LO GUARDADO
            const ofertaClases = esOferta ? "bg-accent text-slate-900 font-bold" : "bg-slate-700";
            const fsClases = esFS ? "bg-red-500 text-white font-bold" : "bg-slate-700";
            const inputBloqueado = esFS ? "disabled" : "";
            const inputOpacidad = esFS ? "opacity-50" : "";
            const inputValorFinal = esFS ? "0" : valPrecio;

            const card = document.createElement('div');
            card.className = "bg-card rounded-xl p-3 shadow flex flex-col gap-2";
            
            // --- MAGIA 2: SE AGREGÓ onfocus="this.select()" PARA PINTAR EL NÚMERO ---
            card.innerHTML = `
                <div class="text-accent font-bold text-sm tracking-wide">
                    ${tituloVisible}
                </div>
                <div class="flex items-center gap-2">
                    <div class="relative flex-grow">
                        <span class="absolute left-3 top-2.5 text-gray-400 font-bold">$</span>
                        <input type="text" inputmode="decimal" 
                            oninput="this.value = this.value.replace('.', ',')" 
                            onfocus="this.select()"
                            id="input_${prodId}" placeholder="0,00" value="${inputValorFinal}" ${inputBloqueado}
                            class="w-full bg-slate-800 text-white rounded-lg pl-8 pr-3 py-2 outline-none focus:ring-2 focus:ring-accent transition ${inputOpacidad}">
                    </div>
                    <button id="btn_oferta_${prodId}" onclick="toggleOferta('${prodId}')" data-oferta="${esOferta ? 'SI' : 'NO'}"
                        class="px-4 py-2 rounded-lg ${ofertaClases} text-sm font-medium border border-transparent transition-colors">
                        Oferta
                    </button>
                    <button id="btn_fs_${prodId}" onclick="toggleFS('${prodId}')" data-fs="${esFS ? 'SI' : 'NO'}"
                        class="px-3 py-2 rounded-lg ${fsClases} text-sm font-medium border border-transparent transition-colors flex items-center gap-1">
                        <span class="text-red-400 text-xs">🚫</span> F/S
                    </button>
                </div>
            `;
            
            card.dataset.cat = prod.cat;
            card.dataset.marca = prod.marca;
            card.dataset.gr = prod.gr;
            
            container.appendChild(card);
        });
    }

    function toggleOferta(id) {
        const btn = document.getElementById(`btn_oferta_${id}`);
        // Leemos el estado del dataset nuevo
        const isActive = btn.dataset.oferta === "SI";
        if (isActive) {
            btn.classList.remove('bg-accent', 'text-slate-900', 'font-bold');
            btn.classList.add('bg-slate-700');
            btn.dataset.oferta = "NO";
        } else {
            btn.classList.add('bg-accent', 'text-slate-900', 'font-bold');
            btn.classList.remove('bg-slate-700');
            btn.dataset.oferta = "SI";
        }
    }

    function toggleFS(id) {
        const btn = document.getElementById(`btn_fs_${id}`);
        const input = document.getElementById(`input_${id}`);
        // Leemos el estado del dataset nuevo
        const isActive = btn.dataset.fs === "SI";
        
        if (isActive) {
            btn.classList.remove('bg-red-500', 'text-white', 'font-bold');
            btn.classList.add('bg-slate-700');
            btn.dataset.fs = "NO";
            input.disabled = false;
            input.classList.remove('opacity-50');
            input.value = "";
        } else {
            btn.classList.add('bg-red-500', 'text-white', 'font-bold');
            btn.classList.remove('bg-slate-700');
            btn.dataset.fs = "SI";
            input.value = "0";
            input.disabled = true;
            input.classList.add('opacity-50');
        }
    }

    async function exportarToma() {
        const confirmacion = confirm("¿Terminaste de cargar los precios? Se enviarán a la base de datos.");
        if(!confirmacion) return;

        const cards = document.querySelectorAll('#products-container > div');
        const fechaActual = new Date().toLocaleString('es-AR');
        let registrosParaEnviar = [];
        let hayDatos = false;

        cards.forEach(card => {
            const id = card.querySelector('input').id.replace('input_', '');
            
            const cat = card.dataset.cat;
            const marca = card.dataset.marca;
            const gr = card.dataset.gr;
            
            let precio = document.getElementById(`input_${id}`).value;
            precio = precio.replace(/\./g, ','); 

            const btnOferta = document.getElementById(`btn_oferta_${id}`);
            const btnFS = document.getElementById(`btn_fs_${id}`);
            
            const oferta = btnOferta.dataset.oferta === "SI" ? "SI" : "NO";
            const fs = btnFS.dataset.fs === "SI" ? "SI" : "NO";

            if (precio !== "" || fs === "SI") {
                hayDatos = true;
                registrosParaEnviar.push({
                    id: 'ID_' + Math.random().toString(36).substr(2, 9),
                    fecha: fechaActual,
                    repositor: "", 
                    local: currentSession.local,
                    tipo: currentSession.tipo,
                    categoria: cat,
                    marca: marca,
                    gramaje: gr,
                    precio: precio || 0,
                    oferta: oferta,
                    fs: fs
                });
            }
        });

        if(!hayDatos){
            alert("No cargaste ningún precio. Revisa la lista.");
            return;
        }

        // --- MAGIA 3: GUARDAR TODO EN EL NAVEGADOR DEL CELULAR AL ENVIAR ---
        try {
            let memoria = JSON.parse(localStorage.getItem('memoriaPreciosApp')) || {};
            let preciosDeEsteLocal = {};
            
            registrosParaEnviar.forEach(r => {
                const clave = r.categoria + '_' + r.marca + '_' + r.gramaje;
                preciosDeEsteLocal[clave] = {
                    precio: r.precio,
                    oferta: r.oferta,
                    fs: r.fs
                };
            });
            
            memoria[currentSession.local] = preciosDeEsteLocal;
            localStorage.setItem('memoriaPreciosApp', JSON.stringify(memoria));
        } catch(e) {
            console.error("No se pudo guardar en memoria local");
        }
        // -------------------------------------------------------------------

        // TU URL EXACTA Y FUNCIONAL QUE ME PASASTE
        const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbyJjaIqLOeWV2lvLw_GQtqtSZrgzH-HgvvbI7af8Bfewk84TtY77VmFQbyiAZNk6PwE/exec';

        try {
            alert("Enviando datos a la nube, por favor espera un momento...");
            
            await fetch(URL_SCRIPT, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(registrosParaEnviar)
            });

            alert("¡Toma enviada con éxito! Los precios ya se actualizaron en la base de datos.");
            document.getElementById('form-view').classList.add('hidden');
            document.getElementById('home-view').classList.remove('hidden');
            currentSession = null;

        } catch (error) {
            alert("Hubo un error al enviar. Revisa tu conexión a internet.");
            console.error(error);
        }
    }

    // --- EVENTO UNIVERSAL QUE HACE QUE EL ENTER BAJE AL SIGUIENTE CASILLERO ---
    document.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' || event.keyCode === 13) {
            event.preventDefault(); 
            
            const inputs = Array.from(document.querySelectorAll('input[id^="input_"]:not(:disabled)'));
            const index = inputs.indexOf(event.target);
            
            if (index > -1 && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }
        }
    });

</script>
</body>
</html>
