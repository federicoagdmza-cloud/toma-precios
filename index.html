<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Toma de Precios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #1e293b; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
        .bg-card { background-color: #334155; }
        .bg-darker { background-color: #0f172a; }
        .text-accent { color: #fbbf24; }
        .bg-accent { background-color: #f59e0b; }
        .border-accent { border-color: #f59e0b; }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="text"] { -moz-appearance: textfield; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="antialiased pb-24">

    <!-- MODAL GIGANTE PERSONALIZADO -->
    <div id="custom-modal" class="fixed inset-0 bg-black/90 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-slate-800 border-4 border-slate-600 rounded-3xl p-8 w-full max-w-sm flex flex-col gap-8 shadow-2xl">
            <p id="modal-message" class="text-white text-2xl md:text-3xl font-bold text-center leading-snug"></p>
            <div id="modal-buttons" class="flex flex-col gap-4">
                <!-- Los botones gigantes se generan por JavaScript -->
            </div>
        </div>
    </div>

    <!-- PANTALLA 1: SELECCIÓN DE LOCAL -->
    <div id="home-view" class="p-4 max-w-2xl mx-auto">
        <p class="text-xs font-semibold text-gray-400 tracking-wider mb-1 uppercase">Toma de Precios</p>
        <h1 class="text-3xl font-bold mb-6">¿En qué local estás?</h1>
        <div id="profiles-container" class="flex flex-col gap-3">
            <!-- Se cargan por JavaScript -->
        </div>
    </div>

    <!-- PANTALLA 2: FORMULARIO DE CARGA -->
    <div id="form-view" class="hidden max-w-2xl mx-auto">
        <div class="sticky top-0 bg-darker p-4 flex justify-between items-center z-10 shadow-md">
            <button onclick="goHome()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg text-lg font-bold transition-colors">
                &larr; Volver
            </button>
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]"></div>
                <span id="current-local-name" class="font-bold text-emerald-500 tracking-wide text-lg"></span>
            </div>
        </div>

        <div id="products-container" class="p-4 flex flex-col gap-4"></div>

        <div class="fixed bottom-0 left-0 w-full bg-darker p-4 border-t border-gray-800 z-10 flex justify-center shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.5)]">
            <button id="btn-enviar" onclick="exportarToma()" class="w-full max-w-2xl bg-accent hover:bg-amber-600 text-slate-900 font-extrabold py-5 rounded-xl text-xl transition-colors shadow-lg uppercase tracking-wide">
                Revisar y Enviar
            </button>
        </div>
    </div>

        { cat: "ACEI. TRADICIO", marca: "Legitimo", gr: "900cc", canal: "Ambos" },
        { cat: "ACEI. TRADICIO", marca: "Cocinero girasol", gr: "900cc", canal: "Ambos" },
        { cat: "ACEI. TRADICIO", marca: "Canuelas", gr: "900cc", canal: "Ambos" },
        { cat: "ACEI. TRADICIO", marca: "Natura", gr: "900cc", canal: "Ambos" },
        { cat: "ACEI. TRADICIO", marca: "Pureza", gr: "1500cc", canal: "Ambos" },
        { cat: "ACEI. TRADICIO", marca: "Legitimo", gr: "1500cc", canal: "Ambos" },
        { cat: "ACEI. TRADICIO", marca: "Cocinero girasol", gr: "1500cc", canal: "Ambos" },
        { cat: "ACEI. TRADICIO", marca: "Canuelas", gr: "1500cc", canal: "Ambos" },
        { cat: "ACEI. TRADICIO", marca: "Natura", gr: "1500cc", canal: "Ambos" }
    ];

    let currentSession = null;

    // --- FUNCIÓN DE MODALES GIGANTES ---
    function mostrarCartel(mensaje, tipo = "alert") {
        return new Promise((resolve) => {
            const modal = document.getElementById('custom-modal');
            const msgEl = document.getElementById('modal-message');
            const btnsEl = document.getElementById('modal-buttons');
            
            msgEl.innerText = mensaje;
            btnsEl.innerHTML = ''; // Limpiamos botones
            
            if (tipo === "confirm") {
                const btnOk = document.createElement('button');
                btnOk.className = "w-full bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-extrabold py-5 rounded-2xl text-2xl shadow-lg";
                btnOk.innerText = "SÍ, ENVIAR";
                btnOk.onclick = () => { modal.classList.add('hidden'); resolve(true); };
                
                const btnCancel = document.createElement('button');
                btnCancel.className = "w-full bg-slate-600 hover:bg-slate-500 text-white font-bold py-4 rounded-2xl text-xl shadow-lg mt-2";
                btnCancel.innerText = "Revisar un poco más";
                btnCancel.onclick = () => { modal.classList.add('hidden'); resolve(false); };
                
                btnsEl.appendChild(btnOk);
                btnsEl.appendChild(btnCancel);
            } else if (tipo === "alert" || tipo === "error") {
                const colorBtn = tipo === "error" ? "bg-red-500 hover:bg-red-600 text-white" : "bg-accent hover:bg-amber-600 text-slate-900";
                const btnOk = document.createElement('button');
                btnOk.className = `w-full ${colorBtn} font-extrabold py-5 rounded-2xl text-2xl shadow-lg`;
                btnOk.innerText = "ENTENDIDO";
                btnOk.onclick = () => { modal.classList.add('hidden'); resolve(true); };
                btnsEl.appendChild(btnOk);
            } else if (tipo === "loading") {
                // Sin botones, el usuario debe esperar
                msgEl.innerHTML = `<span class="text-4xl">⏳</span><br><br>${mensaje}`;
            }
            
            modal.classList.remove('hidden');
        });
    }

    // --- INICIO APP ---
    window.onload = function() {
        const container = document.getElementById('profiles-container');
        container.innerHTML = "";
        
        locales.forEach((p, index) => {
            const initials = p.local.substring(0, 2).toUpperCase();
            const card = document.createElement('div');
            card.className = "bg-card p-4 rounded-xl flex items-center gap-4 cursor-pointer hover:bg-slate-700 transition active:scale-95";
            card.onclick = function() { openForm(index); };
            card.innerHTML = `
                <div class="w-14 h-14 rounded-xl bg-slate-600 flex items-center justify-center text-accent font-black text-2xl">${initials}</div>
                <div>
                    <h2 class="font-bold text-2xl leading-tight">${p.local}</h2>
                    <p class="text-base text-gray-400">${p.tipo}</p>
                </div>
            `;
            container.appendChild(card);
        });
    };

    function openForm(profileIndex) {
        currentSession = locales[profileIndex];
        document.getElementById('home-view').classList.add('hidden');
        document.getElementById('form-view').classList.remove('hidden');
        document.getElementById('current-local-name').innerText = currentSession.local.toUpperCase();
        window.scrollTo(0, 0);
        renderProducts();
    }

    async function goHome() {
        const modal = document.getElementById('custom-modal');
        const msgEl = document.getElementById('modal-message');
        const btnsEl = document.getElementById('modal-buttons');
        
        msgEl.innerText = "¿Seguro que quieres volver al inicio?";
        btnsEl.innerHTML = '';
        
        const btnOk = document.createElement('button');
        btnOk.className = "w-full bg-red-500 hover:bg-red-600 text-white font-extrabold py-5 rounded-2xl text-xl shadow-lg";
        btnOk.innerText = "SÍ, VOLVER AL MENÚ";
        btnOk.onclick = () => { 
            modal.classList.add('hidden'); 
            document.getElementById('form-view').classList.add('hidden');
            document.getElementById('home-view').classList.remove('hidden');
            currentSession = null;
        };
        
        const btnCancel = document.createElement('button');
        btnCancel.className = "w-full bg-slate-600 hover:bg-slate-500 text-white font-bold py-4 rounded-2xl text-xl shadow-lg mt-2";
        btnCancel.innerText = "No, quedarme acá";
        btnCancel.onclick = () => { modal.classList.add('hidden'); };
        
        btnsEl.appendChild(btnOk);
        btnsEl.appendChild(btnCancel);
        modal.classList.remove('hidden');
    }

    function renderProducts() {
        const container = document.getElementById('products-container');
        container.innerHTML = ''; 

        const prodsFiltrados = productosBase.filter(p => p.canal === "Ambos" || p.canal === currentSession.tipo);

        let memoriaGuardada = {};
        try {
            memoriaGuardada = JSON.parse(localStorage.getItem('memoriaPreciosApp')) || {};
        } catch(e) {}
        const preciosDeEsteLocal = memoriaGuardada[currentSession.local] || {};

        prodsFiltrados.forEach((prod, idx) => {
            const prodId = `prod_${idx}`;
            const tituloVisible = prod.alias ? prod.alias : `${prod.cat} ${prod.marca} ${prod.gr}`;
            const claveProducto = prod.cat + '_' + prod.marca + '_' + prod.gr;
            const datosViejos = preciosDeEsteLocal[claveProducto];
            
            let valPrecio = "";
            let esOferta = false;
            let esFS = false;
            
            if (datosViejos) {
                valPrecio = (datosViejos.precio !== "0" && datosViejos.precio !== 0) ? datosViejos.precio : "";
                esOferta = datosViejos.oferta === "SI";
                esFS = datosViejos.fs === "SI";
            }
            
            const ofertaClases = esOferta ? "bg-accent text-slate-900 font-bold" : "bg-slate-700";
            const fsClases = esFS ? "bg-red-500 text-white font-bold" : "bg-slate-700";
            const inputBloqueado = esFS ? "disabled" : "";
            const inputOpacidad = esFS ? "opacity-50" : "";
            const inputValorFinal = esFS ? "0" : valPrecio;

            const card = document.createElement('div');
            card.className = "bg-card rounded-xl p-3 shadow flex flex-col gap-2";
            
            card.innerHTML = `
                <div class="text-accent font-bold text-base tracking-wide leading-tight">
                    ${tituloVisible}
                </div>
                <div class="flex items-center gap-2 mt-1">
                    <div class="relative flex-grow">
                        <span class="absolute left-3 top-2.5 text-gray-400 font-bold text-lg">$</span>
                        <input type="text" inputmode="decimal" 
                            oninput="this.value = this.value.replace('.', ',')" 
                            onfocus="this.select()"
                            id="input_${prodId}" placeholder="0,00" value="${inputValorFinal}" ${inputBloqueado}
                            class="w-full bg-slate-800 text-white font-bold text-xl rounded-lg pl-8 pr-3 py-2 outline-none focus:ring-2 focus:ring-accent transition ${inputOpacidad}">
                    </div>
                    <button id="btn_oferta_${prodId}" onclick="toggleOferta('${prodId}')" data-oferta="${esOferta ? 'SI' : 'NO'}"
                        class="px-4 py-3 rounded-lg ${ofertaClases} text-base font-bold border border-transparent transition-colors">
                        Oferta
                    </button>
                    <button id="btn_fs_${prodId}" onclick="toggleFS('${prodId}')" data-fs="${esFS ? 'SI' : 'NO'}"
                        class="px-3 py-3 rounded-lg ${fsClases} text-base font-bold border border-transparent transition-colors flex items-center gap-1">
                        <span class="text-red-200 text-sm">🚫</span> F/S
                    </button>
                </div>
            `;
            
            card.dataset.cat = prod.cat;
            card.dataset.marca = prod.marca;
            card.dataset.gr = prod.gr;
            
            container.appendChild(card);
        });
    }

    function toggleOferta(id) {
        const btn = document.getElementById(`btn_oferta_${id}`);
        const isActive = btn.dataset.oferta === "SI";
        if (isActive) {
            btn.classList.remove('bg-accent', 'text-slate-900', 'font-bold');
            btn.classList.add('bg-slate-700');
            btn.dataset.oferta = "NO";
        } else {
            btn.classList.add('bg-accent', 'text-slate-900', 'font-bold');
            btn.classList.remove('bg-slate-700');
            btn.dataset.oferta = "SI";
        }
    }

    function toggleFS(id) {
        const btn = document.getElementById(`btn_fs_${id}`);
        const input = document.getElementById(`input_${id}`);
        const isActive = btn.dataset.fs === "SI";
        
        if (isActive) {
            btn.classList.remove('bg-red-500', 'text-white', 'font-bold');
            btn.classList.add('bg-slate-700');
            btn.dataset.fs = "NO";
            input.disabled = false;
            input.classList.remove('opacity-50');
            input.value = "";
        } else {
            btn.classList.add('bg-red-500', 'text-white', 'font-bold');
            btn.classList.remove('bg-slate-700');
            btn.dataset.fs = "SI";
            input.value = "0";
            input.disabled = true;
            input.classList.add('opacity-50');
        }
    }

    async function exportarToma() {
        // --- USAMOS EL NUEVO CARTEL GIGANTE ---
        const confirmacion = await mostrarCartel("¿Ya terminaste de cargar todos los precios?", "confirm");
        if(!confirmacion) return;

        const cards = document.querySelectorAll('#products-container > div');
        const fechaActual = new Date().toLocaleString('es-AR');
        let registrosParaEnviar = [];
        let hayDatos = false;

        cards.forEach(card => {
            const id = card.querySelector('input').id.replace('input_', '');
            const cat = card.dataset.cat;
            const marca = card.dataset.marca;
            const gr = card.dataset.gr;
            let precio = document.getElementById(`input_${id}`).value;
            precio = precio.replace(/\./g, ','); 

            const btnOferta = document.getElementById(`btn_oferta_${id}`);
            const btnFS = document.getElementById(`btn_fs_${id}`);
            const oferta = btnOferta.dataset.oferta === "SI" ? "SI" : "NO";
            const fs = btnFS.dataset.fs === "SI" ? "SI" : "NO";

            if (precio !== "" || fs === "SI") {
                hayDatos = true;
                registrosParaEnviar.push({
                    id: 'ID_' + Math.random().toString(36).substr(2, 9),
                    fecha: fechaActual,
                    repositor: "", 
                    local: currentSession.local,
                    tipo: currentSession.tipo,
                    categoria: cat,
                    marca: marca,
                    gramaje: gr,
                    precio: precio || 0,
                    oferta: oferta,
                    fs: fs
                });
            }
        });

        if(!hayDatos){
            await mostrarCartel("No cargaste ningún precio todavía. Revisa la lista por favor.", "alert");
            return;
        }

        // GUARDADO EN MEMORIA 
        try {
            let memoria = JSON.parse(localStorage.getItem('memoriaPreciosApp')) || {};
            let preciosDeEsteLocal = {};
            registrosParaEnviar.forEach(r => {
                const clave = r.categoria + '_' + r.marca + '_' + r.gramaje;
                preciosDeEsteLocal[clave] = { precio: r.precio, oferta: r.oferta, fs: r.fs };
            });
            memoria[currentSession.local] = preciosDeEsteLocal;
            localStorage.setItem('memoriaPreciosApp', JSON.stringify(memoria));
        } catch(e) { console.error("No se guardó en local"); }

        // --- PEGA TU URL DE APPS SCRIPT AQUÍ ---
        const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbyJjaIqLOeWV2lvLw_GQtqtSZrgzH-HgvvbI7af8Bfewk84TtY77VmFQbyiAZNk6PwE/exec';

        // Cartel gigante de carga (bloquea la pantalla entera, no pueden tocar nada)
        mostrarCartel("Enviando precios a la matriz...", "loading");

        try {
            await fetch(URL_SCRIPT, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(registrosParaEnviar)
            });

            // Cartel gigante de ÉXITO (Pausa todo hasta que toquen Entendido)
            await mostrarCartel("¡TOMA ENVIADA CON ÉXITO!", "alert");
            
            document.getElementById('form-view').classList.add('hidden');
            document.getElementById('home-view').classList.remove('hidden');
            currentSession = null;

        } catch (error) {
            // Cartel gigante de ERROR
            await mostrarCartel("Hubo un problema de señal. Acércate a un lugar con internet y vuelve a intentar.", "error");
            console.error(error);
        }
    }

    document.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' || event.keyCode === 13) {
            event.preventDefault(); 
            const inputs = Array.from(document.querySelectorAll('input[id^="input_"]:not(:disabled)'));
            const index = inputs.indexOf(event.target);
            if (index > -1 && index < inputs.length - 1) {
                inputs[index + 1].focus();
            }
        }
    });
</script>
